name: Actualizar tipos de cambio

on:
  schedule:
    - cron: '0 12 * * *' # todos los días a las 12:00 UTC (~08:00 hora Bolivia)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-rates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Obtener tipos de cambio
        run: node scripts/fetch-rates.mjs

      - name: Commitear y pushear cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Sin cambios en los tipos de cambio, no se commitea nada."
          else
            git commit -m "chore: actualizar tipos de cambio $(date -u +%Y-%m-%d)"
            git push
          fi

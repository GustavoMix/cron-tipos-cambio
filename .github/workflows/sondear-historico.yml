# Workflow temporal para descubrir una fuente de histórico del BCB.
# Se borra una vez que sepamos qué endpoint sirve.
name: Sondear histórico (temporal)

on:
  workflow_dispatch: {}

jobs:
  sondear:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sondear fuentes
        run: python scripts/sondear_historico.py
